name: Security hardening
description: Track a non-confidential security control or review finding.
title: "[SECURITY] "
labels: [security-review-required]
body:
  - type: markdown
    attributes:
      value: Do not include exploit details, credentials, customer data, signed URLs or evidence content. Use a private security advisory for confidential findings.
  - type: textarea
    id: boundary
    attributes:
      label: Threat and trust boundary
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase / dependency ID
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Required controls and negative tests
    validations:
      required: true
  - type: textarea
    id: release
    attributes:
      label: Evidence, rollout, rollback and monitoring
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner and security reviewer
    validations:
      required: true
