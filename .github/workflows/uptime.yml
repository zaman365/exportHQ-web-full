name: uptime

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check public, fail-closed and webhook boundaries
        run: node scripts/production-uptime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uptime-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/exporthq-uptime.json
          if-no-files-found: error
          retention-days: 30
